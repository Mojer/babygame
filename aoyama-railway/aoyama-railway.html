<style>
/* Layout: full-bleed 3D diorama; overlays are enamel-and-brass instrument plates pinned to the corners and a driver's console along the bottom. */
:root {
  --ink: #ece6d6;
  --muted: #a3ab9d;
  --panel: rgba(13, 21, 18, 0.80);
  --panel-edge: rgba(210, 169, 78, 0.35);
  --line: rgba(236, 230, 214, 0.13);
  --brass: #d2a94e;
  --brass-deep: #8f6f2a;
  --red: #e0533a;
  --green: #55b886;
  --amber: #e8a73c;
  --ground: #0c1310;
  --f-display: "Saira Condensed", "Noto Sans TC", "PingFang TC", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.panel { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05); }
.label { font-family: var(--f-display); font-weight: 600; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.plate { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 14px); padding: 12px 16px 12px; display: grid; gap: 4px; max-width: min(340px, calc(100vw - 28px)); }
.plate h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .04em; line-height: 1; display: flex; align-items: baseline; gap: 10px; }
.plate h1 small { font-size: 12px; letter-spacing: .18em; color: var(--brass); font-weight: 600; }
.plate p { margin: 0; font-size: 12px; color: var(--muted); }
.status { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.chip { font-family: var(--f-mono); font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
.chip.warn i { background: var(--amber); }
.chip.stop i { background: var(--red); }

.cams { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: calc(env(safe-area-inset-right, 0px) + 14px); padding: 6px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 28px); }
.cams button { font: 600 13px/1 var(--f-body); color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 8px 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.cams button kbd { font: 500 10px var(--f-mono); color: var(--muted); opacity: .7; }
.cams button:hover { color: var(--ink); border-color: var(--line); }
.cams button[aria-pressed="true"] { color: #1a1407; background: var(--brass); }
.cams button[aria-pressed="true"] kbd { color: #1a1407; }

.console { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; grid-template-columns: auto minmax(0, 300px) auto; gap: 18px; align-items: center; padding: 12px 18px 12px 12px; width: max-content; max-width: calc(100vw - 28px); }
.gauge { width: 136px; height: 136px; position: relative; }
.gauge canvas { width: 100%; height: 100%; display: block; }
.lever { display: grid; gap: 8px; min-width: 0; }
.lever-head { display: flex; justify-content: space-between; align-items: baseline; }
.lever-head output { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.lever-head output.rev { color: var(--amber); }
.lever-head output.fwd { color: var(--green); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 6px; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(232,167,60,.55), rgba(255,255,255,.08) 48%, rgba(255,255,255,.08) 52%, rgba(85,184,134,.6)); border: 1px solid var(--line); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(232,167,60,.55), rgba(255,255,255,.08) 48%, rgba(255,255,255,.08) 52%, rgba(85,184,134,.6)); border: 1px solid var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 26px; margin-top: -10px; border-radius: 5px; background: linear-gradient(180deg, #f0d48a, var(--brass) 45%, var(--brass-deep)); border: 1px solid #3a2c0d; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
input[type=range]::-moz-range-thumb { width: 22px; height: 26px; border-radius: 5px; background: linear-gradient(180deg, #f0d48a, var(--brass) 45%, var(--brass-deep)); border: 1px solid #3a2c0d; }
.lever-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -4px; }
.readouts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.readouts div { display: grid; gap: 2px; min-width: 0; }
.readouts b { font-family: var(--f-mono); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.readouts em { font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.btn { font: 500 13px/1 var(--f-body); color: var(--ink); background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 104px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.btn kbd { font: 500 10px var(--f-mono); color: var(--muted); }
.btn:hover { border-color: rgba(236,230,214,.3); }
.btn:focus-visible, .cams button:focus-visible, .envbar button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.btn[aria-pressed="true"] { border-color: var(--brass); background: rgba(210,169,78,.14); }
.btn[aria-pressed="true"]::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 8px var(--brass); }
.btn.danger { border-color: rgba(224,83,58,.5); }
.btn.danger.active, .btn.danger:active { background: rgba(224,83,58,.3); }

.envbar { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 14px); top: calc(env(safe-area-inset-top, 0px) + 72px); padding: 10px 12px; display: grid; gap: 6px; width: 220px; }
.envrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.envrow output { font-family: var(--f-mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.envbar button { font: 500 12px var(--f-body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
.envbar button[aria-pressed="true"] { color: #1a1407; background: var(--brass); border-color: var(--brass); }
.keys { font-size: 11px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--line); padding-top: 6px; }
.keys kbd { font: 500 10px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--ink); }

#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); transform: translate(-50%, -8px); padding: 10px 16px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none; max-width: calc(100vw - 40px); text-align: center; z-index: 5; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast b { color: var(--brass); font-weight: 700; }

#loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ground); z-index: 20; transition: opacity .6s; }
#loader div { display: grid; gap: 10px; justify-items: center; font-family: var(--f-display); letter-spacing: .2em; color: var(--muted); font-size: 14px; }
#loader b { font-size: 30px; color: var(--ink); letter-spacing: .08em; }
#loader.done { opacity: 0; pointer-events: none; }

@media (max-width: 980px) {
  .envbar { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); right: calc(env(safe-area-inset-right, 0px) + 14px); }
  .console { left: calc(env(safe-area-inset-left, 0px) + 14px); transform: none; max-width: calc(100vw - 28px - 250px); grid-template-columns: auto minmax(0, 1fr); }
  .btns { grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .keys { display: none; }
}
@media (max-width: 720px) {
  .plate { padding: 9px 12px; }
  .plate h1 { font-size: 21px; }
  .plate p { display: none; }
  .cams { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 300px); right: calc(env(safe-area-inset-right, 0px) + 10px); left: calc(env(safe-area-inset-left, 0px) + 10px); justify-content: center; }
  .cams button { padding: 7px 9px; font-size: 12px; }
  .cams button kbd { display: none; }
  .envbar { top: calc(env(safe-area-inset-top, 0px) + 12px); bottom: auto; right: calc(env(safe-area-inset-right, 0px) + 10px); width: 150px; padding: 8px 10px; }
  .envbar .label { display: none; }
  .console { left: calc(env(safe-area-inset-left, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); width: auto; max-width: none; gap: 10px; padding: 10px; grid-template-columns: auto minmax(0, 1fr); }
  .gauge { width: 104px; height: 104px; }
  .btn { min-width: 0; padding: 9px 8px; font-size: 12px; }
  .btn kbd { display: none; }
  .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .readouts div:nth-child(3) { display: none; }
  .plate .status { display: none; }

</section>

<script>
(() => {
