<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ball vs Ball 滾珠大作戰 2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 選球畫面 -->
  <div id="select-screen" class="screen">
    <!-- 塗鴉裝飾（手繪風太陽/雲/星星） -->
    <svg class="doodle doodle-sun" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="20" fill="#ffd94d" stroke="#e8a13c" stroke-width="4" stroke-linecap="round" stroke-dasharray="118 8"/>
      <g stroke="#e8a13c" stroke-width="4" stroke-linecap="round">
        <path d="M50 18 L49 8"/><path d="M50 82 L52 92"/><path d="M18 50 L8 51"/><path d="M82 50 L92 48"/>
        <path d="M27 27 L20 19"/><path d="M73 27 L81 20"/><path d="M27 73 L19 80"/><path d="M73 73 L80 81"/>
      </g>
    </svg>
    <svg class="doodle doodle-cloud" viewBox="0 0 120 70" fill="none">
      <path d="M25 55 Q10 55 12 42 Q13 30 27 32 Q30 16 46 19 Q60 8 72 20 Q90 15 92 32 Q108 34 105 46 Q104 57 88 56 Z"
        fill="#fffdf7" stroke="#8fa8c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="doodle doodle-star" viewBox="0 0 80 80" fill="none">
      <path d="M40 8 Q43 26 48 30 Q64 32 70 35 Q56 45 53 49 Q56 64 58 71 Q45 62 40 61 Q28 68 22 72 Q26 58 26 50 Q14 40 10 35 Q26 32 32 29 Q36 18 40 8 Z"
        fill="#ffe27a" stroke="#e8b13c" stroke-width="4" stroke-linejoin="round"/>
    </svg>
    <h1 class="title">滾珠大作戰 2</h1>
    <p class="subtitle">BALL vs BALL</p>
    <div id="pick-prompt" class="pick-prompt p1">玩家 1，請選擇你的角色！</div>
    <div id="ball-list" class="ball-list"></div>
    <div class="picked-row">
      <div class="picked-slot" id="picked-p1"><span class="slot-label p1-text">P1</span><canvas width="72" height="72"></canvas></div>
      <div class="vs">VS</div>
      <div class="picked-slot" id="picked-p2"><span class="slot-label p2-text">P2</span><canvas width="72" height="72"></canvas></div>
    </div>
    <div class="map-pick"><span class="map-label">地圖</span><div id="map-list"></div></div>
    <button id="start-btn" class="big-btn" disabled>開始比賽</button>
    <p class="hint">其餘 4 位角色將成為中立隊一同競速，第一個抵達終點的角色獲勝，小心別讓中立隊搶走冠軍！</p>
  </div>

  <!-- 比賽畫面 -->
  <div id="race-screen" class="screen hidden">
    <canvas id="game"></canvas>
    <div id="countdown" class="countdown hidden"></div>
    <div class="hud-top">
      <div class="hud-player p1-bg" id="hud-p1"><canvas width="40" height="40"></canvas><span id="hud-p1-rank">-</span></div>
      <div class="hud-player p2-bg" id="hud-p2"><canvas width="40" height="40"></canvas><span id="hud-p2-rank">-</span></div>
    </div>
    <button id="boost-p1" class="boost-btn p1-bg">P1 加速<br><span class="charges">●●●</span></button>
    <button id="boost-p2" class="boost-btn p2-bg">P2 加速<br><span class="charges">●●●</span></button>
  </div>

  <!-- 結果畫面 -->
  <div id="result-screen" class="screen overlay hidden">
    <div class="result-card">
      <div id="result-title" class="result-title">玩家 1 獲勝！</div>
      <canvas id="result-ball" width="120" height="120"></canvas>
      <ol id="result-ranking" class="ranking"></ol>
      <button id="rematch-btn" class="big-btn">再來一局</button>
    </div>
  </div>

  <script src="maps/overview.js"></script>
  <script src="maps/sketch.js"></script>
  <script src="maps/kid.js"></script>
  <script src="maps/spring.js"></script>
  <script src="game.js"></script>
</body>
</html>
