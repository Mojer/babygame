<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eae8df"><meta name="description" content="由程式生成、會自行運作的 Three.js 桌上迷你城市。"><title>小日子城市 · Miniature Living City</title>  <script type="module" crossorigin src="./assets/index-CJenFGZm.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-D7pCiSq5.css">
</head><body><div id="app"><div id="scene" aria-label="互動 3D 城市，拖曳旋轉、滾輪縮放"></div><header><a class="brand" href="./"><span class="brand-icon">▥</span><span>小日子城市<small>MINIATURE LIVING CITY</small></span></a><div class="live"><i></i> 城市運行中 <span>·</span> VOL. 001</div><button id="panel-toggle" class="icon-button" aria-label="開關控制面板" aria-expanded="true">☷</button></header><section class="intro"><div class="eyebrow">A LITTLE WORLD, ALWAYS ALIVE</div><h1>把日常，縮小一點。</h1><p>一座小小的城市，一段慢慢的時光。</p></section><aside id="panel"><div class="panel-heading"><span>城市控制室</span><span class="tag">LIVE</span></div><p class="section-label">01 / 城市時刻</p><div class="segmented" id="time-controls"><button data-time="day" class="active">☀ 白天</button><button data-time="sunset">◒ 黃昏</button><button data-time="night">☾ 夜晚</button></div><div class="weather"><span id="weather-icon">☀</span><div><strong id="time-label">14:30</strong><small id="weather-label">晴朗午後 · 柔和日光</small></div></div><div class="divider"></div><p class="section-label">02 / 城市律動</p><label class="toggle-row"><span>高架列車<small>沿著城市，繞一個圈</small></span><input type="checkbox" data-setting="train" checked><span class="switch"></span></label><label class="toggle-row"><span>廣場噴泉<small>聽見水花的節奏</small></span><input type="checkbox" data-setting="fountain" checked><span class="switch"></span></label><label class="toggle-row"><span>街道交通<small>每個人都有自己的目的地</small></span><input type="checkbox" data-setting="traffic" checked><span class="switch"></span></label><label class="toggle-row"><span>建築燈光<small>為每一扇窗留一盞燈</small></span><input type="checkbox" data-setting="lights" checked><span class="switch"></span></label><div class="divider"></div><div class="speed-title"><span>生活步調</span><output id="speed-value">1.0×</output></div><input id="speed" aria-label="動畫速度" type="range" min="0.25" max="2" step="0.25" value="1"><div class="range-label"><span>慢慢來</span><span>快一點</span></div><button id="copy" class="export">↗ 複製場景設定</button></aside><div id="building-info" hidden><button id="close-info" aria-label="關閉建築資訊">×</button><div class="eyebrow">CITY ARCHITECTURE</div><h2 id="building-name"></h2><p id="building-description"></p></div><footer><div class="stats"><div><strong>16</strong><span>棟建築</span></div><div><strong>80</strong><span>棵樹木</span></div><div><strong>01</strong><span>座小宇宙</span></div></div><div class="camera-tools"><button id="reset" title="重設視角">⌂ <span>回到全景</span></button><button id="tour" aria-pressed="false">◎ <span>環城漫遊</span></button><button id="pause" aria-pressed="false">Ⅱ <span>暫停時光</span></button></div><div class="hint">拖曳旋轉 <b>·</b> 滾輪縮放 <b>·</b> 點選建築</div></footer><div id="toast" role="status"></div><div id="loading">正在搭建你的小小城市…</div></div></body></html>
