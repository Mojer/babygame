<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Prehistoric Island</title>
<style>
:root{
  --glass: rgba(13,19,17,.60);
  --glass2: rgba(22,30,27,.78);
  --line: rgba(255,255,255,.11);
  --txt:#eef2e8; --mut:#a7b3a3; --acc:#ffcf70; --acc2:#8fe3c8; --bad:#ff8a73;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1418;color:var(--txt);
  font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.hidden{display:none!important}
#brand{position:fixed;top:12px;left:12px;padding:8px 12px 8px 10px;border-radius:13px;display:flex;gap:10px;align-items:center;z-index:3}
#brand .logo{width:26px;height:26px;border-radius:8px;background:radial-gradient(circle at 35% 30%,#ffd98a,#d9822b 55%,#7a3b12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
#brand .t{font-weight:650;letter-spacing:.01em;font-size:13.5px}
#brand .sub{color:var(--mut);font-size:11px}
#hint{position:fixed;top:12px;right:12px;padding:8px 12px;border-radius:12px;color:var(--mut);font-size:11.5px;z-index:3;transition:opacity .8s}
#sel{position:fixed;top:64px;left:12px;width:262px;border-radius:14px;padding:11px 12px;z-index:3}
#sel .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#sel .sn{font-weight:650;font-size:14px}
#sel .ss{color:var(--acc2);font-size:12px;margin-top:2px}
#sel .sb{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
#sel .hint{color:var(--mut);font-size:11px}
.x{appearance:none;border:0;background:rgba(255,255,255,.07);color:var(--txt);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:12px}
.x:hover{background:rgba(255,255,255,.14)}
.chip{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);border-radius:999px;padding:4px 10px;font:inherit;font-size:11.5px;cursor:pointer}
.chip.on{background:rgba(255,207,112,.16);border-color:rgba(255,207,112,.45);color:var(--acc)}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-8px);padding:8px 14px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:6;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{color:var(--bad)}
#bar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:stretch;padding:5px;border-radius:18px;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none;z-index:4}
#bar::-webkit-scrollbar{display:none}
.grp{display:flex;gap:1px;padding:0 4px;border-right:1px solid var(--line);flex:none}
.grp:last-child{border-right:0}
.tb{appearance:none;border:0;background:transparent;color:var(--txt);width:54px;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;font:inherit;font-size:10.3px;letter-spacing:.01em;opacity:.93;transition:background .15s,color .15s,transform .08s;flex:none;position:relative}
.tb:hover{background:rgba(255,255,255,.08)}
.tb:active{transform:scale(.94)}
.tb.on{background:rgba(255,207,112,.17);color:var(--acc)}
.tb.flash{background:rgba(143,227,200,.22);color:var(--acc2)}
.tb svg,.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pop{position:fixed;bottom:80px;min-width:230px;max-width:calc(100vw - 20px);padding:12px;border-radius:15px;display:none;z-index:5;background:var(--glass2)}
.pop.show{display:block;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop h4{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:650}
.row{display:flex;align-items:center;gap:10px;margin:9px 0}
.row label{width:62px;color:var(--mut);font-size:12px}
.row output{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt);font-size:12px}
input[type=range]{flex:1;accent-color:var(--acc);height:20px;min-width:110px}
.list{display:flex;flex-direction:column;gap:2px;max-height:min(50vh,360px);overflow:auto}
.li{appearance:none;border:0;background:transparent;color:var(--txt);text-align:left;padding:7px 9px;border-radius:9px;font:inherit;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:9px}
.li:hover{background:rgba(255,255,255,.08)}
.li .dot{width:9px;height:9px;border-radius:50%;flex:none}
.li .st{margin-left:auto;color:var(--mut);font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.sw{appearance:none;border:1px solid var(--line);width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.08);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#cfd6cb;transition:left .18s,background .18s}
.sw.on{background:rgba(255,207,112,.35)}
.sw.on::after{left:18px;background:var(--acc)}
#loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1d3a3a,#081012 70%);transition:opacity .9s}
#loading .lw{width:min(320px,80vw);text-align:center}
#loading .lt{font-size:22px;font-weight:650;letter-spacing:.02em}
#loading .ls{color:var(--mut);margin:8px 0 14px;font-size:12.5px;min-height:18px}
#loading .lb{height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#loading .lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fe3c8,#ffcf70);transition:width .3s}
#crosshair{position:fixed;pointer-events:none;z-index:2;width:0;height:0}
@media (max-width:720px){
  .tb{width:48px;height:46px;font-size:9.4px}
  #brand .sub{display:none}
  #hint{display:none}
  #sel{top:auto;bottom:78px;left:8px;right:8px;width:auto}
  .pop{left:8px!important;right:8px;bottom:74px}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="loading"><div class="lw"><div class="lt">Prehistoric Island</div><div class="ls" id="lmsg">Raising the island…</div><div class="lb"><i id="lbar"></i></div></div></div>

<div id="brand" class="glass"><div class="logo"></div><div><div class="t">Prehistoric Island</div><div class="sub" id="sub">Living diorama · Day</div></div></div>
<div id="hint" class="glass">Drag to orbit · Scroll or pinch to zoom · Click an animal to follow</div>

<div id="sel" class="glass hidden">
  <div class="sh"><div><div class="sn" id="selName">—</div><div class="ss" id="selStatus">—</div></div><button id="selClose" class="x" title="Deselect (Esc)">✕</button></div>
  <div class="sb"><button id="selFollow" class="chip on">Following</button><span class="hint" id="selHint">Actions apply to this animal</span></div>
</div>

<div id="toast"></div>

<div id="bar" class="glass">
  <div class="grp">
    <button class="tb" data-pop="view" title="Camera views"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>View</button>
    <button class="tb" data-pop="animals" title="Select and follow an animal"><svg viewBox="0 0 24 24"><path d="M12 21c-3 0-5-2-5-4.5S9.5 11 12 11s5 3 5 5.5S15 21 12 21z"/><circle cx="5.5" cy="9.5" r="1.8"/><circle cx="12" cy="5.5" r="1.8"/><circle cx="18.5" cy="9.5" r="1.8"/></svg>Animals</button>
  </div>
  <div class="grp">
    <button class="tb" id="bPlant" title="Place plant food, then click open ground"><svg viewBox="0 0 24 24"><path d="M5 20c0-9 6-15 15-15 0 9-6 15-15 15z"/><path d="M5 20l9-9"/></svg>Plants</button>
    <button class="tb" id="bMeat" title="Place meat, then click open ground"><svg viewBox="0 0 24 24"><ellipse cx="13.5" cy="10.5" rx="6.5" ry="5.2"/><path d="M8.6 14.2 4 18.8"/><circle cx="3.6" cy="19.6" r="1.4"/><circle cx="5.2" cy="21" r="1.1"/></svg>Meat</button>
  </div>
  <div class="grp">
    <button class="tb" id="bDrink" title="Drink"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>Drink</button>
    <button class="tb" id="bRest" title="Rest"><svg viewBox="0 0 24 24"><path d="M4 11h6l-6 7h6"/><path d="M13 4h7l-7 8h7"/></svg>Rest</button>
    <button class="tb" id="bCall" title="Call"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>Call</button>
    <button class="tb" id="bHerd" title="Move a herd"><svg viewBox="0 0 24 24"><path d="M3 7h10m-3-3 3 3-3 3M3 17h10m-3-3 3 3-3 3M9 12h11m-3-3 3 3-3 3"/></svg>Herd</button>
  </div>
  <div class="grp">
    <button class="tb" id="bHatch" title="Hatch an egg"><svg viewBox="0 0 24 24"><path d="M12 3c3.5 0 6.5 5.5 6.5 10a6.5 6.5 0 0 1-13 0C5.5 8.5 8.5 3 12 3z"/><path d="M6.2 12.5 8.6 11l2.2 1.6 2.4-1.6 2.3 1.6 2.4-1.3"/></svg>Hatch</button>
    <button class="tb" id="bSurface" title="Marine reptile surfaces"><svg viewBox="0 0 24 24"><path d="M2 17c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M7 13c1.5-5 5-8 10-8-2 2-2.5 4.5-1.5 7"/></svg>Surface</button>
  </div>
  <div class="grp">
    <button class="tb on" data-tod="day" title="Daylight"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>Day</button>
    <button class="tb" data-tod="sunset" title="Sunset"><svg viewBox="0 0 24 24"><path d="M6.5 16a5.5 5.5 0 0 1 11 0"/><path d="M2 19h20M12 4v3M4.5 9.5l1.8 1.3M19.5 9.5l-1.8 1.3"/></svg>Sunset</button>
    <button class="tb" data-tod="night" title="Night"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Night</button>
  </div>
  <div class="grp">
    <button class="tb" data-pop="weather" title="Rain, wind and volcano"><svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 1 1 1-7.9A5 5 0 0 1 18 9a3 3 0 0 1 0 6H7z"/><path d="M9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5"/></svg>Weather</button>
    <button class="tb" data-pop="audio" id="bAudio" title="Music and sound"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>Sound</button>
  </div>
  <div class="grp">
    <button class="tb" id="bPause" title="Pause simulation (Space)"><svg viewBox="0 0 24 24" id="pauseIc"><path d="M8 5v14M16 5v14"/></svg><span id="pauseLb">Pause</span></button>
    <button class="tb" id="bReset" title="Reset the scene"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 3.5v5h5"/></svg>Reset</button>
  </div>
</div>

<div id="pop-view" class="pop glass">
  <h4>Camera</h4>
  <div class="grid2">
    <button class="li" data-cam="overview">Overview</button>
    <button class="li" data-cam="section">Underwater section</button>
    <button class="li" data-cam="volcano">Volcano</button>
    <button class="li" data-cam="falls">Waterfall &amp; pond</button>
    <button class="li" data-cam="station">Research station</button>
    <button class="li" data-cam="nests">Nests</button>
  </div>
</div>
<div id="pop-animals" class="pop glass"><h4>Select &amp; follow</h4><div class="list" id="animalList"></div></div>
<div id="pop-weather" class="pop glass">
  <h4>Weather</h4>
  <div class="row"><label for="rRain">Rain</label><input id="rRain" type="range" min="0" max="1" step="0.01" value="0"><output id="oRain">0%</output></div>
  <div class="row"><label for="rWind">Wind</label><input id="rWind" type="range" min="0" max="1" step="0.01" value="0.35"><output id="oWind">35%</output></div>
  <div class="row"><label for="rVolc">Volcano</label><input id="rVolc" type="range" min="0" max="1" step="0.01" value="0.25"><output id="oVolc">25%</output></div>
</div>
<div id="pop-audio" class="pop glass">
  <h4>Sound</h4>
  <div class="row"><label>Music</label><button class="sw on" id="swMusic" aria-label="Music"></button><span style="flex:1"></span></div>
  <div class="row"><label>Nature</label><button class="sw on" id="swAmb" aria-label="Ambience"></button><span style="flex:1"></span></div>
  <div class="row"><label for="rVol">Volume</label><input id="rVol" type="range" min="0" max="1" step="0.01" value="0.7"><output id="oVol">70%</output></div>
  <div style="color:var(--mut);font-size:11px;margin-top:4px" id="audioNote">Audio starts after your first click.</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   Utilities
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const PI = Math.PI, TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const angWrap = (a) => { while (a > PI) a -= TAU; while (a < -PI) a += TAU; return a; };
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const col = (h) => new THREE.Color(h);
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let rnd = mulberry32(20261126);
const rr = (a, b) => a + (b - a) * rnd();
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

// Seeded gradient noise
const perm = new Uint8Array(512);
{ const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
const G2 = [[1, 0], [-1, 0], [0, 1], [0, -1], [0.7071, 0.7071], [-0.7071, 0.7071], [0.7071, -0.7071], [-0.7071, -0.7071]];
function noise2(x, y) {
  const X = Math.floor(x), Y = Math.floor(y), xf = x - X, yf = y - Y, xi = X & 255, yi = Y & 255;
  const g = (i, j, dx, dy) => { const v = G2[perm[i + perm[j]] & 7]; return v[0] * dx + v[1] * dy; };
  const n00 = g(xi, yi, xf, yf), n10 = g(xi + 1, yi, xf - 1, yf), n01 = g(xi, yi + 1, xf, yf - 1), n11 = g(xi + 1, yi + 1, xf - 1, yf - 1);
  const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  return lerp(lerp(n00, n10, u), lerp(n01, n11, u), v) * 1.45;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * noise2(x * f, y * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }
function distSeg(px, pz, ax, az, bx, bz) { const vx = bx - ax, vz = bz - az; const t = clamp(((px - ax) * vx + (pz - az) * vz) / (vx * vx + vz * vz || 1), 0, 1); return Math.hypot(px - ax - vx * t, pz - az - vz * t); }
function distPoly(px, pz, pl) { let d = 1e9; for (let i = 0; i < pl.length - 1; i++) d = Math.min(d, distSeg(px, pz, pl[i][0], pl[i][1], pl[i + 1][0], pl[i + 1][1])); return d; }

/* =====================================================================
   World layout
   ===================================================================== */
const R = 80;            // radius of the diorama disc (water wall)
const BASE = -26;        // bottom of the cross-section
const N = 256;           // terrain grid segments
const CELL = (2 * R) / N;
const VOL = { x: -24, z: -18 };
const PLAT = { x: 17, z: -27 };
const POND = { x: 15, z: -9, r: 6.5 };
const POND_Y = 2.55;
const STA = { x: 26, z: 16 };
const MEAD = { x: -12, z: 20 };
const PLAINS = { x: 6, z: 35 };
const NESTS = [{ x: -31, z: 9 }, { x: -25, z: 17.5 }];
const FALL_TOP = { x: 15.5, z: -19.7 }, FALL_END = { x: 15.5, z: -14.2 };
const STREAM = [[19, -30.5], [17.5, -25], [15.5, -19.4]];
const TRAILS = [
  [[-12, 20], [-2, 12], [8, 4], [13, 0.5]],
  [[-12, 20], [-4, 30], [6, 35]],
  [[6, 35], [18, 28], [26, 20]],
  [[26, 16], [22, 6], [16, 1]],
  [[-12, 20], [-22, 14], [-27, 12]],
  [[16, 1], [28, -6], [36, -12]],
  [[6, 35], [-8, 41]],
  [[13, 0.5], [2, -6], [-6, -4]],
];

function coastR(a) { return 50 + 3.2 * Math.sin(3 * a + 0.7) + 2.0 * Math.sin(5 * a + 2.1) + 4 * fbm(Math.cos(a) * 1.6 + 3.3, Math.sin(a) * 1.6 + 7.7, 3); }
function cliffK(a) { return smooth(0.55, 0.9, Math.cos(a - PI - 0.15)); }
function trailDist(x, z) { let d = 1e9; for (const t of TRAILS) d = Math.min(d, distPoly(x, z, t)); return d; }

function rawH(x, z) {
  const r = Math.hypot(x, z), a = Math.atan2(z, x);
  const t = coastR(a) - r, ck = cliffK(a);
  let L, C;
  if (t >= 0) L = Math.min(t, 7) * 0.16 + smooth(5, 26, t) * 3.2; else { const s = -t; L = -0.25 * s - 14 * smooth(3, 24, s); }
  if (t >= -4) C = -3 + 10.5 * smooth(-4, 2, t) + 1.5 * smooth(2, 18, t); else { const s = -t - 4; C = -3 - 0.5 * s - 12 * smooth(0, 18, s); }
  let h = lerp(L, C, ck);
  const inland = smooth(2, 16, t);
  h += fbm(x * 0.035 + 11, z * 0.035 + 3, 4) * 2.6 * inland + fbm(x * 0.12, z * 0.12, 2) * 0.35 * inland;
  h += fbm(x * 0.08 + 40, z * 0.08, 3) * 1.3 * smooth(-1, -6, h);
  // volcano
  const dv = Math.hypot(x - VOL.x, z - VOL.z);
  const ridge = 1 + 0.13 * fbm(Math.atan2(z - VOL.z, x - VOL.x) * 3 + dv * 0.08, dv * 0.1, 3);
  h += 24 * Math.pow(1 - smooth(2.5, 27, dv), 1.35) * ridge - 7 * (1 - smooth(2.0, 5.0, dv));
  // pond surroundings, plateau (waterfall cliff), stream channel, pond basin
  const dp = Math.hypot(x - POND.x, z - POND.z);
  h = lerp(h, 3.0, 1 - smooth(8, 13, dp));
  const e = Math.hypot((x - PLAT.x) / 12, (z - PLAT.z) / 8.5);
  const pk = 1 - smooth(0.86, 1.12, e);

function doHatch() {
  let best = null, bd = 1e9;
  for (const n of NESTOBJ) for (const e of n.eggs) if (e.state === 'idle') { const d = controls.target.distanceTo(e.group.position); if (d < bd) { bd = d; best = e; } }

function doSurface() {

function onResize() {

  PXU.value = (h * DPR) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));

/* =====================================================================
   Main loop & init
   ===================================================================== */
let last = performance.now(), uiT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000) || 0.016; last = now;
  const sdt = PAUSED ? 0 : dt;
  if (CAMSHAKE.off) { camera.position.sub(CAMSHAKE.off); CAMSHAKE.off = null; }
  simTime += sdt; U.uTime.value = simTime;
  updateEnv(dt);
  if (sdt > 0) {
    for (const c of LAND) c.update(sdt);
    for (const c of HATCHLINGS) c.update(sdt);
    MARINE.update(sdt); for (const p of PTEROS) p.update(sdt);
    updateFish(sdt); updateBirds(sdt); updateClouds(sdt); updateEggs(sdt); updateFoods(); updateHerds(sdt); FX.update(sdt);
    if (CAMSHAKE.t > 0) CAMSHAKE.t -= sdt;
  }
  updateCamera(dt);
  if (CAMSHAKE.t > 0 && !PAUSED) { const a = 0.1 * CAMSHAKE.t * ENV.volc; CAMSHAKE.off = V3(rr(-a, a), rr(-a, a), rr(-a, a)); camera.position.add(CAMSHAKE.off); }
  sky.position.copy(camera.position);

  AUDIO.update(dt);

}
async function init() {

    buildTerrain(); L('Filling the ocean…', 0.25); await nextFrame();
    buildWater(); buildVolcano(); L('Building the research station…', 0.35); await nextFrame();
    buildStation(); buildNests(); for (const o of OBST) occupy(o.x, o.z, o.r); occupy(STA.x, STA.z, 9.5);
    L('Growing prehistoric forests…', 0.45); await nextFrame();
    buildVegetation(); finishDecks(); L('Mapping safe paths…', 0.6); await nextFrame();
    buildNav(); buildDrinkSpots(); L('Hatching dinosaurs…', 0.72); await nextFrame();
    spawnCreatures(); MARINE = new Marine(); SELECTABLE.push(MARINE);
    for (let i = 0; i < 4; i++) { const p = new Ptero(i); PTEROS.push(p); SELECTABLE.push(p); }
    L('Clouds, rain and fireflies…', 0.86); await nextFrame();
    buildFish(); buildBirds(); buildClouds(); buildRain(); buildInsects(); buildBubbles(); buildFoodGeo(); FX.init(); buildUI();
    onResize(); updateEnv(0, true); camera.position.copy(fitPos(camera.position, controls.target));
    L('Final touches…', 0.95); await nextFrame();
    renderer.compile(scene, camera);
  } catch (err) { console.error(err); $('#lmsg').textContent = 'Something went wrong: ' + err.message; throw err; }
  const diag = () => {
    const out = { ik: 0, ikWho: '', float: 0, overlap: 1e9, overlapWho: '', inObst: 0, obstWho: '', stance: 0 };
    const all = [...LAND, ...HATCHLINGS], a = V3(), b = V3();
    for (const c of all) {
      for (const L of c.legs) {
        if (L.inSwing) continue; out.stance++;
        if (L.type === 'digi') { L.toeB.getWorldPosition(a); b.copy(L.ball); } else { L.ankleB.getWorldPosition(a); b.copy(L.foot).addScaledVector(L.n, L.l3); }
        const e = a.distanceTo(b); if (e > out.ik) { const H = L.hipB.getWorldPosition(V3()); out.ik = e; out.ikWho = `${c.name} ${L.front ? 'front' : 'hind'} rest=${c.restW.toFixed(2)} head=${c.headW.toFixed(2)} feed=${c.feedW.toFixed(2)} act=${c.action ? c.action.type : '-'} d=${H.distanceTo(b).toFixed(2)} l1+l2=${(L.l1 + L.l2).toFixed(2)} |l1-l2|=${Math.abs(L.l1 - L.l2).toFixed(2)} spd=${c.speed.toFixed(2)}`; }
        const f = Math.abs(L.foot.y - groundH(L.foot.x, L.foot.z)); if (f > out.float) out.float = f;
      }
      if (!c.isHatch && clearAt(c.x, c.z) < c.radius * 0.45) { out.inObst++; out.obstWho = c.name + ' ' + clearAt(c.x, c.z).toFixed(2); }
    }
    for (let i = 0; i < LAND.length; i++) for (let j = i + 1; j < LAND.length; j++) {
      const A = LAND[i], B = LAND[j];
      for (const ca of A.circles) for (const cb of B.circles) {
        const d = Math.hypot(A.x + Math.sin(A.heading) * ca.z - B.x - Math.sin(B.heading) * cb.z, A.z + Math.cos(A.heading) * ca.z - B.z - Math.cos(B.heading) * cb.z) - ca.r - cb.r;
        if (d < out.overlap) { out.overlap = d; out.overlapWho = A.name + '/' + B.name; }

  window.__island = { diag, LAND, MARINE, PTEROS, HATCHLINGS, FOODS, ENV, UI, camera, controls, select, doHatch, doSurface, doDrink, doRest, doCall, doHerd, placeFood, resetAll, setTod, setPaused, groundH, foodValid, rayGround, camTo, CAMS, clear, cellOf, get simTime() { return simTime; } };

init();
