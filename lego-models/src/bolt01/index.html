<style>
/* Layout: LEGO 說明書風格 — 左側 3D 舞台，右側步驟卡；下方零件表與 LDraw 匯出 */
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171e; --panel:#1a212b; --fg:#e6ecf2; --muted:#93a1b1; --line:#2b3542;
  --accent:#6aa6ff; --stage-a:#1e2733; --stage-b:#10151c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12171e; --panel:#1a212b; --fg:#e6ecf2; --muted:#93a1b1; --line:#2b3542;
  --accent:#6aa6ff; --stage-a:#1e2733; --stage-b:#10151c; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--muted);margin-top:8px;letter-spacing:0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 35%,var(--stage-a),var(--stage-b));aspect-ratio:4/3.4;max-width:100%;min-height:340px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.stephead{display:flex;align-items:center;gap:14px}
.stepno{background:var(--hi);color:var(--hi-fg);font-family:var(--f-display);font-weight:800;font-size:34px;
  min-width:62px;height:62px;display:grid;place-items:center;border-radius:6px;font-variant-numeric:tabular-nums}
.stephead h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;text-wrap:balance}
.stephead p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.instr{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.callout{border:1px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-wrap:wrap;gap:8px}
.callout-t{width:100%;font-size:12px;color:var(--muted);letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:none}

.arms .callout-t,.arms button{grid-column:1/-1}
.arms label{font-size:13px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.nav{display:flex;gap:8px;align-items:center;margin-top:auto}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 14px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ok{font-size:13px;color:var(--muted)}

<div class="wrap">
  <header>
    <h1>BOLT-01<small>用真實 LEGO 零件拼的方塊機器人 · 可旋轉、逐步查看</small></h1>
    <div class="stats">

  </section>

function R(step,part,color,x0,x1,z0,z1,y0,h,kind){var p={step:step,part:part,color:color,x0:x0,x1:x1,z0:z0,z1:z1,y0:y0,h:h,kind:kind||(h===1?"plate":"brick")};PARTS.push(p);return p}
function S(step,part,color,cx,cy,zf){PARTS.push({step:step,part:part,color:color,cx:cx,cy:cy,zf:zf,kind:"side"})}
R(1,"3020","dbg",-3,-1,-2,2,0,1); R(1,"3020","dbg",1,3,-2,2,0,1);
R(1,"3039","dbg",-3,-1,0,2,1,3,"slope"); R(1,"3039","dbg",1,3,0,2,1,3,"slope");
[1,4].forEach(function(y){R(2,"3003","lbg",-3,-1,-2,0,y,3); R(2,"3003","lbg",1,3,-2,0,y,3)});
R(3,"3032","dbg",-3,3,-2,2,7,1);

function toLDraw(){
  var ROT_Y="0 0 1 0 1 0 -1 0 0", ID="1 0 0 0 1 0 0 0 1", SIDE="1 0 0 0 0 -1 0 1 0";
  function f(n){n=Math.round(n*100)/100;return (n===0?0:n).toString()}
  var out=["0 BOLT-01 Robot","0 Name: BOLT-01.ldr","0 Author: Claude","0 !LDRAW_ORG Unofficial_Model",""];
  for(var s=1;s<=STEPS.length;s++){
    PARTS.filter(function(p){return p.step===s}).forEach(function(p){
      var c=COLORS[p.color].ld,x,y,z,m=ID;
      if(p.kind==="side"){x=p.cx*20;y=-p.cy*8;z=-p.zf*20-8;m=SIDE}
      else if(p.kind==="pin"){x=p.px*20;y=-p.py*8;z=-p.pz*20;m=ROT_Y}
      else if(p.kind==="antenna"){x=(p.x0+p.x1)/2*20;y=-p.y0*8;z=-(p.z0+p.z1)/2*20}
      else{
        var w=p.x1-p.x0,d=p.z1-p.z0;
        x=(p.x0+p.x1)/2*20;y=-(p.y0+p.h)*8;z=-(p.z0+p.z1)/2*20;
        if(d>w)m=ROT_Y;
      }
      out.push(["1",c,f(x),f(y),f(z),m,p.part+".dat"].join(" "));
    });
    out.push("0 STEP");
  }
  return out.join("\n")+"\n";
}

const mats={};
function mat(k){
  if(mats[k])return mats[k];const c=COLORS[k];
  return mats[k]=new THREE.MeshStandardMaterial({color:c.hex,roughness:.7,metalness:k==="silver"?.45:0,flatShading:true,side:THREE.DoubleSide,
    transparent:!!c.trans,opacity:c.trans?.6:1});
}
function b64(s,T){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new T(u.buffer)}
const GEOM={};
function geom(id){
  if(GEOM[id])return GEOM[id];const d=REAL.geo[id];
  const p=b64(d.p,Int16Array),f=new Float32Array(p.length);for(let i=0;i<p.length;i++)f[i]=p[i]*.25;
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(f,3));
  g.setIndex(new THREE.BufferAttribute(b64(d.i,d.i32?Uint32Array:Uint16Array),1));g.computeVertexNormals();
  return GEOM[id]=g;
}
const STUDG=new THREE.CylinderGeometry(6,6,4,16); STUDG.translate(0,-2,0);
const W=new THREE.Matrix4().makeScale(.05,-.05,-.05);
const ldm=(R,P)=>new THREE.Matrix4().set(R[0],R[1],R[2],P[0],R[3],R[4],R[5],P[1],R[6],R[7],R[8],P[2],0,0,0,1);
function realBounds(){const b=new THREE.Box3(),v=new THREE.Vector3();
  REAL.parts.forEach(p=>{v.set(p.P[0]*.05,-p.P[1]*.05,-p.P[2]*.05);b.expandByPoint(v)});return b}
function realGroups(parentOf){
  const groups=new Map(),buckets={};
  REAL.parts.forEach(p=>{
    const par=parentOf(p),gk=p.st+"|"+par.uuid;let g=groups.get(gk);
    if(!g){g=new THREE.Group();g.userData.step=p.st;par.add(g);groups.set(gk,g)}
    const Mw=W.clone().multiply(ldm(p.R,p.P)),bk=gk+"|"+p.id+"|"+p.c;
    (buckets[bk]=buckets[bk]||{g,id:p.id,c:p.c,list:[]}).list.push(Mw);
    const st=REAL.geo[p.id].s;
    if(st.length){const sk=gk+"|stud|"+p.c,b=buckets[sk]=buckets[sk]||{g,id:null,c:p.c,list:[]};
      st.forEach(s=>b.list.push(Mw.clone().multiply(new THREE.Matrix4().makeTranslation(s[0],s[1],s[2]))))}
  });
  for(const k in buckets){const b=buckets[k],im=new THREE.InstancedMesh(b.id?geom(b.id):STUDG,mat(b.c),b.list.length);
    b.list.forEach((M,i)=>im.setMatrixAt(i,M));im.instanceMatrix.needsUpdate=true;im.frustumCulled=false;
    const tr=!!COLORS[b.c].trans;im.castShadow=!tr;im.receiveShadow=!tr;b.g.add(im)}
  return [...groups.values()];
}
function realLDraw(header){
  const f=n=>{n=Math.round(n*1000)/1000;return (Object.is(n,-0)?0:n).toString()},o=header.slice();
  for(let s=1;s<=STEPS.length;s++){REAL.parts.forEach(p=>{if(p.st===s)o.push(["1",COLORS[p.c].ld,...p.P.map(f),...p.R.map(f),p.id+".dat"].join(" "))});o.push("0 STEP")}
  return o.join("\n")+"\n";
}
// ---- end real lib ----
const PH=0.4, stage=document.getElementById("stage");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,0.1,200);
camera.position.set(15,13,21);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,6,0); controls.enableDamping=true; controls.autoRotate=!reduce; controls.autoRotateSpeed=1.2;
controls.minDistance=10; controls.maxDistance=60;
lookSetup(renderer,scene,10,0);
const pivots={};
["L","R"].forEach(k=>{
  const pv=new THREE.Group(); pv.position.set(k==="L"?-3.5:3.5,PIVOT_Y*PH,0); scene.add(pv);
  const holder=new THREE.Group(); holder.position.copy(pv.position).multiplyScalar(-1); pv.add(holder);
  pivots[k]={pv,holder};
});
const objs=realGroups(p=>p.arm?pivots[p.arm].holder:scene);
function setArm(k,deg){pivots[k].pv.rotation.x=-deg*Math.PI/180}

function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage); resize();

let anim=[];
function showStep(n,animate){
  anim=[];
  objs.forEach(o=>{
    const s=o.userData.step; o.visible=s<=n;
    o.position.y=0;
    if(s===n&&animate&&!reduce){o.position.y=3;anim.push({o,t0:performance.now()})}
  });
}
let swing=false, swingT0=0;
function tick(now){
  if(swing){
    const a=Math.sin((now-swingT0)/420)*45;
    setArm("L",a); setArm("R",-a); $("armL").value=Math.round(a); $("armR").value=Math.round(-a);
  }
  anim=anim.filter(a=>{const k=Math.min(1,(now-a.t0)/450);a.o.position.y=3*(1-k)*(1-k);return k<1});
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const $=id=>document.getElementById(id);
const hex=n=>"#"+n.toString(16).padStart(6,"0");
function render(n,animate){
  const st=STEPS[n-1];
  $("no").textContent=n; $("ttl").textContent=st.t; $("sub").textContent=st.s||`第 ${n} / ${STEPS.length} 步`;
  $("instr").innerHTML=st.i.map(x=>`<li>${x}</li>`).join("");
  const grp={};
  PARTS.filter(p=>p.step===n).forEach(p=>{const k=p.part+"|"+p.color;grp[k]=(grp[k]||0)+1});
  $("callout").innerHTML=`<div class="callout-t">這一步需要</div>`+Object.entries(grp).map(([k,c])=>{
    const [part,col]=k.split("|");
    return `<span class="chip"><span class="sw" style="background:${hex(COLORS[col].hex)}"></span>${c}× ${NAMES[part]} <span class="mono">${pid(part)}</span></span>`}).join("");
  $("slider").value=n; $("prev").disabled=n===1; $("next").disabled=n===STEPS.length;
  showStep(n,animate);
}
let cur=STEPS.length;
$("prev").onclick=()=>{if(cur>1)render(--cur,true)};
$("next").onclick=()=>{if(cur<STEPS.length)render(++cur,true)};
$("slider").oninput=e=>{cur=+e.target.value;render(cur,true)};
$("spin").onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.textContent="自動旋轉："+(controls.autoRotate?"開":"關");e.target.setAttribute("aria-pressed",controls.autoRotate)};
if(reduce){$("spin").textContent="自動旋轉：關";$("spin").setAttribute("aria-pressed","false")}
render(cur,false);
function stopSwing(){swing=false;$("swing").textContent="擺動示範";$("swing").setAttribute("aria-pressed","false")}
$("armL").oninput=e=>{stopSwing();setArm("L",+e.target.value)};
$("armR").oninput=e=>{stopSwing();setArm("R",+e.target.value)};
$("swing").onclick=()=>{
  if(swing){stopSwing();return}
  swing=true;swingT0=performance.now();$("swing").textContent="停止擺動";$("swing").setAttribute("aria-pressed","true");
};
setArm("R",70); $("armR").value=70;

const tally={};
PARTS.forEach(p=>{const k=p.part+"|"+p.color;tally[k]=(tally[k]||0)+1});
const order=Object.keys(NAMES);
$("parts").innerHTML=Object.entries(tally).sort((a,b)=>order.indexOf(a[0].split("|")[0])-order.indexOf(b[0].split("|")[0])).map(([k,c])=>{
  const [part,col]=k.split("|");
  return `<tr><td>${NAMES[part]}</td><td class="mono">${pid(part)}</td><td><span class="chip" style="border:0;padding:0"><span class="sw" style="background:${hex(COLORS[col].hex)}"></span>${COLORS[col].name}</span></td><td class="n">${c}</td></tr>`}).join("");
$("s-pcs").textContent=PARTS.length;

const ldr=realLDraw(toLDraw().split("\n").slice(0,5)); $("ldr").value=ldr;
$("copy").onclick=()=>{
  navigator.clipboard.writeText(ldr).then(()=>{$("copied").textContent="已複製，貼到文字檔並存成 BOLT-01.ldr"})
  .catch(()=>{$("ldr").select();$("copied").textContent="已選取全部內容，請按 ⌘C / Ctrl+C 複製"});
};
</script>
