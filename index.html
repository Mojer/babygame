<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12141c" media="(prefers-color-scheme: dark)">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="寶貝遊戲">
  <title>寶貝遊戲選單</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- iPhone X / XS / 11 Pro -->

<!-- iPhone XS Max / 11 Pro Max -->

<!-- iPhone 12 / 13 / 14 -->
<link rel="apple-touch-startup-image" href="splash/launch-1170x2532.png"

<!-- iPhone 12/13/14 Pro Max -->

  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --text: #1c2130;
      --text-soft: #6b7288;
      --line: rgba(28, 33, 48, .07);
      --accent: #ff6b4a;
      --accent-text: #ffffff;
      --shadow: 0 10px 30px rgba(46, 60, 100, .10);
      --radius-card: 22px;
      --radius-tile: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141c;
        --surface: #1c1f2b;
        --text: #f0f2f8;
        --text-soft: #9aa1b8;
        --line: rgba(255, 255, 255, .07);
        --accent: #ff7757;
        --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }

    .shell { max-width: 480px; margin: 0 auto; }

    /* ---------- 頁首 ---------- */
    header { padding: 18px 4px 26px; }
    .hello { font-size: 14px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
    h1 { font-size: 30px; font-weight: 800; letter-spacing: 1px; line-height: 1.2; }
    h1 .wave { display: inline-block; margin-left: 6px; }

    /* ---------- 遊戲卡片 ---------- */
    .games { display: grid; gap: 14px; list-style: none; }
    .game {
      display: flex; align-items: center; gap: 16px;
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: 16px;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      transition: transform .18s cubic-bezier(.16, 1, .3, 1), box-shadow .18s;
    }
    .game:active { transform: scale(.97); }
    @media (hover: hover) {
      .game:hover { transform: translateY(-2px); }
    }
    .game:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .tile {
      flex: none;
      width: 58px; height: 58px;
      border-radius: var(--radius-tile);
      display: grid; place-items: center;
      font-size: 30px;
      background: var(--tile-bg);
    }
    .meta { flex: 1; min-width: 0; }
    .meta .name { font-size: 17px; font-weight: 800; }
    .meta .desc { font-size: 13px; color: var(--text-soft); margin-top: 3px; display: block; }
    .go {
      flex: none;
      font-size: 22px; font-weight: 700;
      color: var(--text-soft);
      opacity: .55;
    }

    /* 每款遊戲的圖示磚底色（淺色 / 深色各一組） */
    .t-red    { --tile-bg: #ffe4de; }
    .t-green  { --tile-bg: #ddf3e0; }
    .t-orange { --tile-bg: #ffedd2; }
    .t-blue   { --tile-bg: #ddebff; }
    .t-gold   { --tile-bg: #fff3c9; }
    .t-purple { --tile-bg: #ece2ff; }
    .t-ice    { --tile-bg: #d9f1fb; }
    .t-forest { --tile-bg: #dbead9; }
    @media (prefers-color-scheme: dark) {
      .t-red    { --tile-bg: #47231e; }
      .t-green  { --tile-bg: #1d3a26; }
      .t-orange { --tile-bg: #423014; }
      .t-blue   { --tile-bg: #1d2f4a; }
      .t-gold   { --tile-bg: #443a14; }
      .t-purple { --tile-bg: #322350; }
      .t-ice    { --tile-bg: #123a4a; }
      .t-forest { --tile-bg: #21331f; }
    }

    /* ---------- 進場動畫 ---------- */
    @media (prefers-reduced-motion: no-preference) {
      header, .game {
        opacity: 0;
        transform: translateY(14px);
        animation: rise .55s cubic-bezier(.16, 1, .3, 1) forwards;
        animation-delay: calc(var(--i, 0) * 70ms);
      }
      @keyframes rise { to { opacity: 1; transform: none; } }
    }

    /* ---------- 加到主畫面提示 ---------- */
    .install {
      position: fixed;
      left: 16px; right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      max-width: 448px; margin: 0 auto;
      display: none;
      align-items: center; gap: 12px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      font-size: 13px; line-height: 1.55;
    }
    .install strong { font-weight: 800; }
    .install .close {
      flex: none;
      font: inherit; font-weight: 700;
      color: var(--accent-text);
      background: var(--accent);
      border: none; border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
    }
    .install .close:active { transform: scale(.95); }
  </style>
</head>
<body>
  <div class="shell">
    <header style="--i:0">
      <p class="hello">今天想玩哪一個呢？</p>
      <h1>寶貝遊戲選單<span class="wave">👋</span></h1>
    </header>

    <ul class="games">
      <li><a class="game" style="--i:1" href="https://mojer.github.io/babygame/babyball" target="_blank" rel="noopener">
        <span class="tile t-red">🎯</span>
        <span class="meta"><span class="name">寶貝被球K</span><span class="desc">閃開飛來的球球！</span></span>
        <span class="go">›</span>
      </a></li>
      <li><a class="game" style="--i:2" href="https://mojer.github.io/babygame/babypickup" target="_blank" rel="noopener">
        <span class="tile t-green">🥦</span>
        <span class="meta"><span class="name">寶貝撿菜菜</span><span class="desc">把掉下來的菜菜通通接住</span></span>
        <span class="go">›</span>
      </a></li>
      <li><a class="game" style="--i:3" href="https://mojer.github.io/babygame/Baby Run" target="_blank" rel="noopener">
        <span class="tile t-orange">🏃</span>
        <span class="meta"><span class="name">寶貝跑跑跑</span><span class="desc">向前衝，跳過障礙！</span></span>
        <span class="go">›</span>
      </a></li>
      <li><a class="game" style="--i:4" href="https://mojer.github.io/babygame/babyrobotshooter" target="_blank" rel="noopener">
        <span class="tile t-blue">🤖</span>
        <span class="meta"><span class="name">寶貝機器人射擊</span><span class="desc">瞄準機器人，射擊！</span></span>
        <span class="go">›</span>
      </a></li>
      <li><a class="game" style="--i:5" href="https://mojer.github.io/babygame/babyballrace" target="_blank" rel="noopener">
        <span class="tile t-gold">🏁</span>
        <span class="meta"><span class="name">滾珠大作戰</span><span class="desc">雙人對戰！誰的球先到終點？</span></span>
        <span class="go">›</span>
      </a></li>
      <li><a class="game" style="--i:6" href="https://mojer.github.io/babygame/babyballrace2" target="_blank" rel="noopener">
        <span class="tile t-purple">🗺️</span>
        <span class="meta"><span class="name">滾珠大作戰 2</span><span class="desc">全地圖一眼看完的滾珠對戰！</span></span>
        <span class="go">›</span>
      </a></li>
      <li><a class="game" style="--i:7" href="https://mojer.github.io/babygame/babyhockey" target="_blank" rel="noopener">
        <span class="tile t-ice">🏒</span>
        <span class="meta"><span class="name">桌上冰球大亂鬥</span><span class="desc">兩人一起玩！60 秒進球比多</span></span>
        <span class="go">›</span>
      </a></li>
      <li><a class="game" style="--i:8" href="https://goblin-wardens-arena.kuma-informa-2811.chatgpt.site/" target="_blank" rel="noopener">
        <span class="tile t-forest">🛡️</span>
        <span class="meta"><span class="name">暮林守衛</span><span class="desc">3D 劍盾生存！擊退成群的哥布林</span></span>
        <span class="go">›</span>
      </a></li>
    </ul>
  </div>

  <div id="installPrompt" class="install">
    <span>👉 用 Safari 點<strong>分享</strong>，選「<strong>加到主畫面</strong>」就能安裝囉！</span>
    <button class="close" onclick="document.getElementById('installPrompt').style.display='none'">知道了</button>
  </div>

<script>
  window.addEventListener('load', () => {
    // 僅在 iPhone Safari 且不是 App 模式時顯示安裝提示
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (isIOS && window.navigator.standalone !== true) {
      document.getElementById('installPrompt').style.display = 'flex';
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Service Worker 註冊成功:', reg))
      .catch(err => console.error('Service Worker 註冊失敗:', err));
  }
</script>
</body>
</html>
